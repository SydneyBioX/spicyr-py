name: wheels
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_SKIP: "pp* *-musllinux_* *-win32 *_i686"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {project}/tests/test_shared_cases.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
  # Publishing to PyPI is deliberately not automated: a maintainer uploads the wheels after review.
