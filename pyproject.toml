[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spicyr"
version = "1.99.8"
description = "Test whether cell types co-localise differently between groups of patients (the Python version of the Bioconductor package spicyR)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Ellis Patrick", email = "ellis.patrick@sydney.edu.au" },
  { name = "Sadiq Dohadwalla" },
  { name = "Elijah Willie" },
  { name = "Nicolas Canete" },
]
maintainers = [{ name = "Ellis Patrick", email = "ellis.patrick@sydney.edu.au" }]
keywords = ["spatial omics", "co-localisation", "cell types", "scverse", "spatialdata", "anndata"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
spatialdata = ["spatialdata>=0.2", "anndata>=0.10"]
plot = ["matplotlib>=3.7", "plotly>=5"]
data = ["rds2py>=0.5"]
test = ["pytest>=7", "anndata>=0.10", "matplotlib>=3.7", "plotly>=5"]
doc = ["sphinx>=7", "myst-nb>=1", "sphinx-book-theme", "sphinx-autodoc-typehints", "ipykernel", "matplotlib>=3.7", "plotly>=5", "anndata>=0.10", "rds2py>=0.5"]

[project.urls]
Homepage = "https://github.com/SydneyBioX/spicyr-py"
Documentation = "https://sydneybiox.github.io/spicyr-py"
"R package (spicyR)" = "https://bioconductor.org/packages/spicyR"

[tool.scikit-build]
wheel.packages = ["src/spicyr"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]

# lint rules of the scverse cookiecutter template (https://github.com/scverse/cookiecutter-scverse)
[tool.ruff]
line-length = 120
src = ["src"]
lint.select = ["B", "BLE", "C4", "D", "E", "F", "I", "RUF100", "TID", "UP", "W"]
lint.ignore = ["B008", "D100", "D104", "D105", "D107", "D203", "D213", "D400", "D401", "E501", "E731", "E741"]
lint.per-file-ignores."*/__init__.py" = ["F401"]
lint.per-file-ignores."docs/*" = ["I"]
lint.per-file-ignores."tests/*" = ["D"]
lint.pydocstyle.convention = "numpy"
